/* ═══════════════════════════════════════════════════════════════════
   CHAT LOGIC
   ═══════════════════════════════════════════════════════════════════ */
function timeNow() {
  return new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
}

function addAgentMessage(loop, text) {
  const messages = document.getElementById('chat-messages');
  if (!messages) return;
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = `
    <div class="msg-avatar"><i data-lucide="${loop.icon}"></i></div>
    <div class="msg-body">
      <div class="msg-head">
        <span class="msg-author">${loop.name}</span>
        <span class="msg-badge ai">IA</span>
        <span class="msg-time">${timeNow()}</span>
      </div>
      <div class="msg-bubble">${text}</div>
    </div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  lucide.createIcons();
}

function addUserMessage(text) {
  const messages = document.getElementById('chat-messages');
  if (!messages) return;
  const div = document.createElement('div');
  div.className = 'msg me';
  div.innerHTML = `
    <div class="msg-avatar lourdes">LM</div>
    <div class="msg-body">
      <div class="msg-head">
        <span class="msg-author">Lourdes</span>
        <span class="msg-badge human">Humano</span>
        <span class="msg-time">${timeNow()}</span>
      </div>
      <div class="msg-bubble">${text}</div>
    </div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  lucide.createIcons();
}

function showTyping() {
  const messages = document.getElementById('chat-messages');
  if (!messages) return;
  const div = document.createElement('div');
  div.id = 'typing-msg';
  div.className = 'msg';
  div.innerHTML = `
    <div class="msg-avatar"><i data-lucide="bot"></i></div>
    <div class="msg-body">
      <div class="msg-bubble" style="padding:6px 10px">
        <div class="typing">
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </div>
      </div>
    </div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  lucide.createIcons();
}

function hideTyping() {
  const t = document.getElementById('typing-msg');
  if (t) t.remove();
}

function askChat(text) {
  addUserMessage(text);
  const input = document.getElementById('chat-input');
  if (input) { input.value = ''; autoresize(input); }

  const loop = agentLoops[state.currentStage];
  if (!loop) return;

  // Buscar el match en el flow
  const lower = text.toLowerCase();
  let match = null;
  for (const f of loop.flow) {
    const triggers = f.trigger.split('|');
    if (triggers.some(t => lower.includes(t))) {
      match = f;
      break;
    }
  }

  setTimeout(() => showTyping(), 300);
  setTimeout(() => {
    hideTyping();
    if (match) {
      addAgentMessage(loop, match.agentReply);
      if (match.action) {
        setTimeout(() => executeAction(match.action), 500);
      }
    } else {
      addAgentMessage(loop, 'Entiendo tu pregunta. ¿Podrías ser más específica? Las acciones que puedo hacer en esta etapa son: ' + loop.flow.map(f => f.trigger.split('|')[0]).join(', ') + '.');
    }
  }, 1500);
}

function sendChatMessage() {
  const input = document.getElementById('chat-input');
  if (!input) return;
  const text = input.value.trim();
  if (text) askChat(text);
}

function autoresize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

/* ═══════════════════════════════════════════════════════════════════
   ACCIONES DEL FLUJO (lo que dispara el chat)
   ═══════════════════════════════════════════════════════════════════ */
function executeAction(action) {
  const ini = state.currentInitiative;
  const f = ini.fields;

  if (action === 'fill-volumen' && f) {
    f.volumenUsuarios.value = f.volumenUsuarios.aiSuggested;
    f.volumenUsuarios.status = 'filled';
    refreshCanvas();
    showToast('Word actualizado: volumen de usuarios');
    autosave();
  }
  else if (action === 'fill-presupuesto' && f) {
    f.presupuesto.value = f.presupuesto.aiSuggested;
    f.presupuesto.status = 'filled';
    refreshCanvas();
    showToast('Word actualizado: presupuesto');
    autosave();
  }
  else if (action === 'fill-all' && f) {
    f.volumenUsuarios.value = f.volumenUsuarios.aiSuggested;
    f.volumenUsuarios.status = 'filled';
    f.presupuesto.value = f.presupuesto.aiSuggested;
    f.presupuesto.status = 'filled';
    refreshCanvas();
    showToast('Word completado con sugerencias del agente');
    autosave();
  }
  else if (action === 'resolve-presupuesto' && f) {
    f.presupuesto.value = f.presupuesto.aiSuggested;
    f.presupuesto.status = 'filled';
    refreshCanvas();
    showToast('Hueco resuelto: presupuesto');
    autosave();
  }
  else if (action === 'resolve-usuarios' && f) {
    f.volumenUsuarios.value = f.volumenUsuarios.aiSuggested;
    f.volumenUsuarios.status = 'filled';
    refreshCanvas();
    showToast('Hueco resuelto: volumen de usuarios');
    autosave();
  }
  else if (action === 'resolve-all' && f) {
    f.volumenUsuarios.value = f.volumenUsuarios.aiSuggested;
    f.volumenUsuarios.status = 'filled';
    f.presupuesto.value = f.presupuesto.aiSuggested;
    f.presupuesto.status = 'filled';
    refreshCanvas();
    showToast('Todos los huecos resueltos por agentes IA');
    autosave();
  }
  else if (action === 'complete-stage') {
    advanceStage();
  }
  else if (action === 'classify-iniciativa') {
    state.classification = 'iniciativa';
    advanceStage();
    showToast('Clasificada como Iniciativa');
    autosave();
  }
  else if (action === 'classify-small') {
    state.classification = 'small-project';
    state.currentStage = 8;
    renderDetail();
    showToast('Clasificada como Small Project');
    autosave();
  }
  else if (action === 'classify-refinar') {
    showToast('Solicitud devuelta a Puerta Única para refinamiento');
    autosave();
  }
  else if (action === 'release-excel') {
    releaseExcel();
  }
}

function refreshCanvas() {
  const canvas = document.getElementById('detail-canvas');
  if (canvas) {
    canvas.innerHTML = renderStageCanvas();
    lucide.createIcons();
    // Re-render charts si aplica
    setTimeout(drawDetailCharts, 50);
  }
}

function advanceStage() {
  const next = state.currentStage + 1;
  let needsFullRender = false;

  // Si es etapa 4 (clasificación) y se avanza, ir a la rama
  if (state.currentStage === 4) {
    if (state.classification === 'iniciativa') state.currentStage = 5;
    else if (state.classification === 'small-project') {
      state.currentStage = 8;
      needsFullRender = true;  // cambio de rama: el stepper cambia estructura
    }
    else state.currentStage = 5;
  }
  // Si está en rama Iniciativa (5,6,7), siguiente
  else if (state.currentStage >= 5 && state.currentStage <= 7) {
    if (state.currentStage === 7) {
      releaseExcel();
      return;
    }
    state.currentStage++;
  }
  // Si está en rama Small Project (8,9,10), siguiente
  else if (state.currentStage >= 8 && state.currentStage <= 10) {
    if (state.currentStage === 10) {
      releaseExcel();
      return;
    }
    state.currentStage++;
  }
  else {
    state.currentStage = next;
  }

  if (needsFullRender) {
    renderDetail();
  } else {
    updateStageView();
  }
  showToast(`Avanzando a etapa ${state.currentStage}`);
}

function goToStage(num) {
  // En modo read-only (iniciativa completada), permitir navegar a cualquier etapa
  if (isInitiativeCompleted(state.currentInitiative)) {
    state.currentStage = num;
    updateStageView();
    return;
  }
  // En modo edición, solo permitir etapas completadas o actual
  if (num > state.currentStage) {
    showToast('Esa etapa aún no se ha iniciado');
    return;
  }
  state.currentStage = num;
  updateStageView();
}

/* Actualiza solo el canvas + clases del stepper, sin re-render completo (evita el flicker/scroll) */
function updateStageView() {
  // 1) Actualizar el canvas central
  const canvas = document.getElementById('detail-canvas');
  if (canvas) {
    canvas.innerHTML = renderStageCanvas();
    canvas.scrollTop = 0;  // scroll al inicio del canvas, NO de la página
  }

  // 2) Actualizar las clases del stepper sin re-renderizarlo
  const stepperItems = document.querySelectorAll('.detail-sidebar .stage-item');
  const isReadOnly = isInitiativeCompleted(state.currentInitiative);
  stepperItems.forEach((item, idx) => {
    // Reconstruir clases según etapa actual
    const stageNum = idx + 1;  // approximation, las branches complican esto
  });

  // En lugar de calcular índices, simplemente re-renderizo el stepper en su contenedor
  const stepperContainer = document.querySelector('.detail-sidebar');
  if (stepperContainer) {
    // Guardar scroll del stepper para restaurarlo
    const stepperScroll = stepperContainer.scrollTop;
    stepperContainer.outerHTML = renderDetailStepper();
    // Restaurar scroll
    const newStepper = document.querySelector('.detail-sidebar');
    if (newStepper) newStepper.scrollTop = stepperScroll;
  }

  // 3) Actualizar el chat panel (cambia agente según etapa)
  if (!isReadOnly) {
    const chatPanel = document.querySelector('.chat-panel');
    if (chatPanel) {
      chatPanel.outerHTML = renderChatPanel();
      // Re-iniciar el chat con el agente de la nueva etapa
      setTimeout(() => {
        const loop = agentLoops[state.currentStage];
        if (loop) {
          const intro = loop.intro.replace('{{folio}}', state.currentInitiative.folio);
          addAgentMessage(loop, intro);
        }
      }, 100);
    }
  }

  lucide.createIcons();
  // Re-dibujar charts del detalle si aplica
  setTimeout(drawDetailCharts, 80);
}

function confirmClassification() {
  if (state.classification === 'iniciativa') {
    state.currentStage = 5;
  } else if (state.classification === 'small-project') {
    state.currentStage = 8;
  } else if (state.classification === 'refinar') {
    showToast('Solicitud devuelta al solicitante');
    setTimeout(() => navTo('dashboard'), 1500);
    return;
  }
  renderDetail();
  showToast(`Clasificada como ${state.classification}`);
}

      },
      options: {
        responsive: true, maintainAspectRatio: false,
        cutout: '78%',
        plugins: { legend: { display: false }, tooltip: { enabled: false } }
      }
    });
  }

  // ROI chart (etapa 6)
  const roiCanvas = document.getElementById('chart-roi');
  if (roiCanvas) {
    new Chart(roiCanvas, {
      type: 'line',
      data: {
        labels: ['M0', 'M3', 'M6', 'M9', 'M12', 'M14', 'M18'],
        datasets: [
          { label: 'Inversión acumulada', data: [0.3, 0.9, 1.5, 2.0, 2.1, 2.1, 2.1], borderColor: '#CBD5E1', backgroundColor: 'rgba(203,213,225,0.1)', tension: 0.4, fill: true },
          { label: 'Beneficios acumulados', data: [0, 0.2, 0.6, 1.2, 1.8, 2.1, 3.5], borderColor: '#6B2C91', backgroundColor: 'rgba(107,44,145,0.1)', tension: 0.4, fill: true }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, padding: 12, usePointStyle: true, pointStyle: 'circle' } },
          tooltip: { backgroundColor: '#0F172A', padding: 10 }
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#94A3B8' } },
          y: { grid: { color: '#F1F5F9' }, ticks: { color: '#94A3B8', callback: v => '$' + v + 'M' } }
        }
      }
    });
  }

  // Roadmap chart (etapa 7) — gantt simple
  const roadmapCanvas = document.getElementById('chart-roadmap');
  if (roadmapCanvas) {
    new Chart(roadmapCanvas, {
      type: 'bar',
      data: {
        labels: ['Análisis', 'Diseño', 'Desarrollo', 'Testing', 'Despliegue'],
        datasets: [
          { label: 'Inicio (semana)', data: [0, 4, 10, 30, 38], backgroundColor: 'transparent', barThickness: 16 },
          { label: 'Duración', data: [4, 6, 20, 8, 4], backgroundColor: '#6B2C91', barThickness: 16, borderRadius: 4 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        indexAxis: 'y',
        plugins: {
          legend: { display: false },
          tooltip: { backgroundColor: '#0F172A', padding: 10 }
        },
        scales: {
          x: { stacked: true, grid: { color: '#F1F5F9' }, ticks: { color: '#94A3B8', callback: v => 'sem ' + v } },
          y: { stacked: true, grid: { display: false }, ticks: { color: '#64748B' } }
        }
      }
    });
  }
}

async function downloadExcel() {
  const ini = state.currentInitiative;

  // Paleta exacta del preview HTML (sin '#' al inicio, formato ARGB para ExcelJS)
  const COLORS = {
    bannerBg: 'FF16A34A',       // verde del banner superior
    bannerText: 'FFFFFFFF',
    titleBarBg: 'FFFDB070',     // naranja del título de iniciativa
    titleBarText: 'FF0F172A',
    headerBg: 'FFF1F5F9',       // gris claro para th
    headerText: 'FF334155',
    labelBg: 'FFF8FAFC',        // gris muy claro para labels de fila
    labelText: 'FF334155',
    aiBg: 'FFF4EDF9',           // morado tenue para celdas IA
    filledBg: 'FFF0FDF4',       // verde tenue para celdas confirmadas
    normalText: 'FF0F172A',
    border: 'FFCBD5E1',
    accent: 'FF6B2C91',         // morado
    ink500: 'FF64748B',
  };

  const workbook = new ExcelJS.Workbook();
  workbook.creator = 'Portal de Iniciativas';
  workbook.created = new Date();
  workbook.title = `${ini.folio} · ${ini.title}`;

  // ─── Helpers de estilos ───────────────────────────────────────────
  const borderStyle = {
    top: { style: 'thin', color: { argb: COLORS.border } },
    left: { style: 'thin', color: { argb: COLORS.border } },
    bottom: { style: 'thin', color: { argb: COLORS.border } },
    right: { style: 'thin', color: { argb: COLORS.border } },
  };

  const setBanner = (sheet, row, text) => {
    sheet.mergeCells(`A${row}:B${row}`);
    const cell = sheet.getCell(`A${row}`);
    cell.value = text;
    cell.font = { name: 'Inter', size: 11, bold: true, color: { argb: COLORS.bannerText } };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.bannerBg } };
    cell.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
    sheet.getRow(row).height = 26;
  };

  const setTitleBar = (sheet, row, text) => {
    sheet.mergeCells(`A${row}:B${row}`);
    const cell = sheet.getCell(`A${row}`);
    cell.value = text;
    cell.font = { name: 'Inter', size: 13, bold: true, color: { argb: COLORS.titleBarText } };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.titleBarBg } };
    cell.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
    sheet.getRow(row).height = 32;
  };

  const setSectionHeader = (sheet, row, text, span = 'A:B') => {
    const [from, to] = span.split(':');
    sheet.mergeCells(`${from}${row}:${to}${row}`);
    const cell = sheet.getCell(`${from}${row}`);
    cell.value = text;
    cell.font = { name: 'Inter', size: 10, bold: true, color: { argb: COLORS.headerText } };
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.headerBg } };
    cell.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
    cell.border = borderStyle;
    sheet.getRow(row).height = 22;
  };

  const setLabelValue = (sheet, row, label, value, type = 'normal') => {
    const labelCell = sheet.getCell(`A${row}`);
    labelCell.value = label;
    labelCell.font = { name: 'Inter', size: 10, bold: true, color: { argb: COLORS.labelText } };
    labelCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.labelBg } };
    labelCell.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
    labelCell.border = borderStyle;

    const valueCell = sheet.getCell(`B${row}`);
    valueCell.value = value;
    valueCell.font = { name: 'Inter', size: 11, color: { argb: COLORS.normalText } };
    valueCell.alignment = { vertical: 'middle', horizontal: 'left', indent: 1, wrapText: true };
    valueCell.border = borderStyle;
    if (type === 'ai') {
      valueCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.aiBg } };
    } else if (type === 'filled') {
      valueCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.filledBg } };
    }
    sheet.getRow(row).height = 20;
  };

  const setTableHeader = (sheet, row, headers) => {
    headers.forEach((h, i) => {
      const cell = sheet.getCell(row, i + 1);
      cell.value = h;
      cell.font = { name: 'Inter', size: 9, bold: true, color: { argb: COLORS.headerText } };
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.headerBg } };
      cell.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
      cell.border = borderStyle;
    });
    sheet.getRow(row).height = 22;
  };

  const setTableRow = (sheet, row, values, types = []) => {
    values.forEach((v, i) => {
      const cell = sheet.getCell(row, i + 1);
      cell.value = v;
      cell.font = { name: 'Inter', size: 11, color: { argb: COLORS.normalText } };
      cell.alignment = { vertical: 'middle', horizontal: 'left', indent: 1, wrapText: true };
      cell.border = borderStyle;
      const type = types[i];
      if (type === 'ai') {
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.aiBg } };
      } else if (type === 'filled') {
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.filledBg } };
      } else if (type === 'label') {
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.labelBg } };
        cell.font = { name: 'Inter', size: 11, bold: true, color: { argb: COLORS.labelText } };
      }
    });
    sheet.getRow(row).height = 20;
  };

  // ═══ HOJA 1: IDENTIFICACIÓN ═══════════════════════════════════════
  const sheet1 = workbook.addWorksheet('Identificación', {
    properties: { defaultRowHeight: 18 },
    views: [{ showGridLines: false }]
  });
  sheet1.columns = [{ width: 32 }, { width: 65 }];

  let r = 1;
  setBanner(sheet1, r++, 'GENTERA · Sinergia TI · Formato de iniciativa para revisión de alto nivel');
  setTitleBar(sheet1, r++, `${ini.folio} — ${ini.title}`);
  r++; // espacio en blanco

  setSectionHeader(sheet1, r++, 'IDENTIFICACIÓN DE LA INICIATIVA');
  setLabelValue(sheet1, r++, 'Folio', ini.folio, 'filled');
  setLabelValue(sheet1, r++, 'Nombre de la iniciativa', ini.title, 'filled');
  setLabelValue(sheet1, r++, 'Descripción', ini.subtitle || '', 'filled');
  setLabelValue(sheet1, r++, 'Empresa impactada', ini.empresa || 'Compartamos Banco MX', 'filled');
  setLabelValue(sheet1, r++, 'Solicitante', `${ini.requester} · ${ini.requesterArea || ''}`, 'filled');
  const clasificacionVal = state.classification === 'iniciativa' ? 'Iniciativa · Agente Clasificador'
    : state.classification === 'small-project' ? 'Small Project · Agente Clasificador'

  setLabelValue(sheet1, r++, 'Clasificación', clasificacionVal, 'ai');
  setLabelValue(sheet1, r++, 'Generado por', 'Portal de Iniciativas QK × Gentera', 'normal');
  setLabelValue(sheet1, r++, 'Fecha de generación', new Date().toLocaleDateString('es-MX', { year: 'numeric', month: 'long', day: 'numeric' }), 'normal');

  // ═══ HOJA 2: BALLPARK ═════════════════════════════════════════════
  const sheet2 = workbook.addWorksheet('Ballpark', {
    properties: { defaultRowHeight: 18 },
    views: [{ showGridLines: false }]
  });
  sheet2.columns = [{ width: 32 }, { width: 28 }, { width: 22 }, { width: 28 }];

  r = 1;
  setBanner(sheet2, r++, 'GENTERA · Sinergia TI · Estimación Ballpark (Pit Stop 1)');
  setTitleBar(sheet2, r++, `${ini.folio} — Estimación preliminar de esfuerzo`);
  r++;

  // Merge para el section header (4 columnas)
  sheet2.mergeCells(`A${r}:D${r}`);
  const ballparkHeader = sheet2.getCell(`A${r}`);
  ballparkHeader.value = 'CONCEPTOS GENERALES';
  ballparkHeader.font = { name: 'Inter', size: 10, bold: true, color: { argb: COLORS.headerText } };
  ballparkHeader.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.headerBg } };
  ballparkHeader.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
  ballparkHeader.border = borderStyle;
  sheet2.getRow(r).height = 22;
  r++;

  setLabelValue(sheet2, r++, 'Esfuerzo total', `${ini.ballpark.total.toLocaleString()} horas · ~${ini.ballpark.weeks} semanas`, 'ai');
  setLabelValue(sheet2, r++, 'Inversión estimada', '$1.8M – $2.4M MXN · Agente Finanzas', 'ai');
  setLabelValue(sheet2, r++, 'Volumen de usuarios', '87 usuarios potenciales · Agente Operaciones', 'ai');
  setLabelValue(sheet2, r++, 'Confianza estimación', `${ini.ballpark.confidence}% · Agente Ballpark`, 'ai');
  setLabelValue(sheet2, r++, 'Desviación esperada', '±60% (etapa inicial)', 'ai');
  setLabelValue(sheet2, r++, 'Sistemas fuente', 'SAP HANA, Salesforce, DWH Snowflake', 'filled');
  setLabelValue(sheet2, r++, 'Compliance', 'CSIRT Nivel 3 · Aprobado', 'filled');
  r++;

  // Tabla de equipos
  sheet2.mergeCells(`A${r}:D${r}`);
  const teamsHeader = sheet2.getCell(`A${r}`);
  teamsHeader.value = 'DESGLOSE POR EQUIPO';
  teamsHeader.font = { name: 'Inter', size: 10, bold: true, color: { argb: COLORS.headerText } };
  teamsHeader.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.headerBg } };
  teamsHeader.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
  teamsHeader.border = borderStyle;
  sheet2.getRow(r).height = 22;
  r++;

  setTableHeader(sheet2, r++, ['Equipo', 'Horas', 'Semanas', 'Recursos']);
  ini.ballpark.teams.forEach(t => {
    setTableRow(sheet2, r++, [
      t.name,
      t.hours,
      t.sub.split('·')[0].trim(),
      t.sub.split('·')[1]?.trim() || ''
    ], ['label', 'ai', 'normal', 'normal']);
  });

  // Total al final
  const totalRow = r;
  sheet2.getCell(`A${totalRow}`).value = 'TOTAL';
  sheet2.getCell(`A${totalRow}`).font = { name: 'Inter', size: 11, bold: true, color: { argb: COLORS.accent } };
  sheet2.getCell(`A${totalRow}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.aiBg } };
  sheet2.getCell(`A${totalRow}`).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
  sheet2.getCell(`A${totalRow}`).border = borderStyle;

  sheet2.getCell(`B${totalRow}`).value = ini.ballpark.total;
  sheet2.getCell(`B${totalRow}`).font = { name: 'Inter', size: 11, bold: true, color: { argb: COLORS.accent } };
  sheet2.getCell(`B${totalRow}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.aiBg } };
  sheet2.getCell(`B${totalRow}`).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
  sheet2.getCell(`B${totalRow}`).border = borderStyle;

  sheet2.getCell(`C${totalRow}`).value = `${ini.ballpark.weeks} sem`;
  sheet2.getCell(`C${totalRow}`).font = { name: 'Inter', size: 11, bold: true, color: { argb: COLORS.accent } };

  sheet2.getCell(`D${totalRow}`).value = '—';
  sheet2.getCell(`D${totalRow}`).font = { name: 'Inter', size: 11, color: { argb: COLORS.ink500 } };
  sheet2.getCell(`D${totalRow}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.aiBg } };
  sheet2.getCell(`D${totalRow}`).alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
  sheet2.getCell(`D${totalRow}`).border = borderStyle;

  // ═══ HOJA 3: ROADMAP ══════════════════════════════════════════════
  const sheet3 = workbook.addWorksheet('Roadmap', {

  rdmHeader.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
  rdmHeader.border = borderStyle;
  sheet3.getRow(r).height = 22;
  r++;

  const setLabelValueWide = (sheet, row, label, value, type) => {
    sheet.mergeCells(`B${row}:C${row}`);
    const labelCell = sheet.getCell(`A${row}`);
    labelCell.value = label;
    labelCell.font = { name: 'Inter', size: 11, bold: true, color: { argb: COLORS.labelText } };
    labelCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.labelBg } };
    labelCell.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
    labelCell.border = borderStyle;

    vc.font = { name: 'Inter', size: 11, color: { argb: COLORS.normalText } };

    vc.border = borderStyle;
    if (type === 'ai') vc.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.aiBg } };
    else if (type === 'filled') vc.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: COLORS.filledBg } };
    sheet.getRow(row).height = 20;
  };

  setLabelValueWide(sheet3, r++, 'Ventana propuesta', 'Q3 2026 · Agente Roadmap', 'ai');
  setLabelValueWide(sheet3, r++, 'Kickoff', 'Agosto 2026', 'filled');
  setLabelValueWide(sheet3, r++, 'Go-live', 'Diciembre 2026', 'filled');

/* Editor de configuración de un agente (modal) */
function openAgentConfig(id) {
  const agent = AGENTES_CONFIG.find(a => a.id === id);
  if (!agent) return;
  agentConfigState.selectedId = id;

  const modal = document.getElementById('excel-modal');
  document.getElementById('excel-modal-body').innerHTML = renderAgentConfigEditor(agent);
  // Cambiar el header del modal
  const header = modal.querySelector('.modal-header');
  if (header) {
    header.innerHTML = `
      <div class="modal-title-block">
        <div class="modal-title-icon" style="background: var(--accent-soft); color: var(--accent);">
          <i data-lucide="${agent.icon}"></i>
        </div>
        <div>
          <div class="modal-title">Configurar ${agent.name}</div>
          <div class="modal-subtitle">Etapa ${agent.stageNum} · ${agent.stage}</div>
        </div>
      </div>
      <button class="modal-close" onclick="closeAgentConfig()"><i data-lucide="x"></i></button>
    `;
  }
  // Cambiar el footer del modal
  const footer = modal.querySelector('.modal-footer');
  if (footer) {
    footer.innerHTML = `
      <div style="font-size: 12px; color: var(--ink-600);">
        <i data-lucide="info" style="width:12px;height:12px;vertical-align:-2px"></i>
        Los cambios se guardan automáticamente al confirmar.

      </div>
    `;

  modal.classList.add('open');
  lucide.createIcons();
}

function saveAgentConfig() {
  const id = agentConfigState.selectedId;
  if (!id) return;
  const agent = AGENTES_CONFIG.find(a => a.id === id);

  // Leer valores del formulario
  const promptEl = document.getElementById(`config-prompt-${id}`);
  const thresholdEl = document.getElementById(`config-threshold-${id}`);
  if (promptEl) agent.prompt = promptEl.value;
  if (thresholdEl) agent.confidenceThreshold = parseInt(thresholdEl.value);

  closeAgentConfig();
  showToast(`${agent.name} actualizado correctamente`);
}

function toggleAgentMode(id, mode) {
  const agent = AGENTES_CONFIG.find(a => a.id === id);
  if (!agent) return;
  agent.mode = mode;
  // Re-render del editor
  document.getElementById('excel-modal-body').innerHTML = renderAgentConfigEditor(agent);
  lucide.createIcons();
}

function togglePasswordVisibility() {
  const input = document.getElementById('login-password');

  if (!input || !eye) return;
  if (input.type === 'password') {
    input.type = 'text';
    eye.setAttribute('data-lucide', 'eye-off');
  } else {
    input.type = 'password';
    eye.setAttribute('data-lucide', 'eye');
  }
  lucide.createIcons();
}

/* ═══════════════════════════════════════════════════════════════════
   AUTO-SAVE LOGIC
   ═══════════════════════════════════════════════════════════════════ */
function triggerAutosave() {
  const indicator = document.getElementById('autosave-indicator');
  const text = document.getElementById('autosave-text');
  if (!indicator || !text) return;

  // Saving state
  indicator.className = 'autosave-indicator saving';
  indicator.querySelector('i').setAttribute('data-lucide', 'loader-2');
  text.textContent = 'Guardando…';
  lucide.createIcons();

  // Simulamos un guardado
  setTimeout(() => {
    state.lastSaved = new Date();
    state.savingState = 'saved';
    if (indicator && text) {
      indicator.className = 'autosave-indicator saved';
      indicator.querySelector('i').setAttribute('data-lucide', 'check');
      text.textContent = 'Guardado';
      lucide.createIcons();
    }
  }, 700);
}

/* Llamado al final de cada acción modificadora */
function autosave() {
  triggerAutosave();
}

function renderStageAlert(stageNum) {
  // Mostramos un alert distinto según el contexto de la iniciativa
  const ini = state.currentInitiative;
  if (!ini) return '';

  // Si la iniciativa está bloqueada, mostrar alerta en la etapa actual
  if (ini.status === 'blocked' && stageNum === ini.stage) {
    return `
      <div class="alert-block alert-danger">
        <div class="alert-block-icon"><i data-lucide="alert-octagon"></i></div>
        <div class="alert-block-body">
          <div class="alert-block-title">Iniciativa bloqueada</div>
          <div class="alert-block-desc">
            Esta iniciativa tiene un bloqueo que impide avanzar. El Agente Técnico no pudo obtener respuesta del Agente Finanzas en 48h.
          </div>
          <div class="alert-block-actions">
            <button class="btn btn-secondary btn-sm" onclick="showToast('Reintentando consulta a Finanzas…')"><i data-lucide="refresh-cw"></i> Reintentar</button>
            <button class="btn btn-secondary btn-sm" onclick="showToast('Solicitud enviada a Finanzas vía email')"><i data-lucide="mail"></i> Escalar manualmente</button>
            <button class="btn btn-secondary btn-sm" onclick="showToast('Iniciativa pausada por 7 días')"><i data-lucide="pause"></i> Pausar</button>
          </div>
        </div>
      </div>
    `;
  }

  // En etapa 5 (Sesión Escucha) mostrar warning de proceso en desarrollo
  if (stageNum === 5) {
    return `
      <div class="alert-block alert-warning">
        <div class="alert-block-icon"><i data-lucide="alert-triangle"></i></div>
        <div class="alert-block-body">
          <div class="alert-block-title">Etapa en desarrollo dentro del proceso oficial</div>
          <div class="alert-block-desc">
            La Sesión de Escucha está siendo formalizada en Sinergia TI. Este pre-cálculo del Agente Ballpark se confirmará en la sesión cuando esté lista.
          </div>
        </div>
      </div>
    `;
  }

  // Etapa 4: aviso de que la decisión es humana
  if (stageNum === 4) {
    return `
      <div class="alert-block alert-info">
        <div class="alert-block-icon"><i data-lucide="info"></i></div>
        <div class="alert-block-body">
          <div class="alert-block-title">Decisión humana requerida</div>

          </div>
        </div>
      </div>
    `;
  }

  return '';
}

function renderProgressCard(ini) {
  const totalStages = ini.type === 'small-project' ? 11 : 11;  // mismo total
  const isCompleted = ini.status === 'completed' || ini.stage === 11;
  const isBlocked = ini.status === 'blocked';

  const stageName = ini.stageName || (STAGES.find(s => s.num === ini.stage)?.name || '');

  let barClass = '';
  if (isCompleted) barClass = 'completed';
  else if (isBlocked) barClass = 'blocked';

  const typeBadge = ini.type === 'iniciativa'
    ? '<span class="badge badge-iniciativa"><span class="badge-dot"></span>Iniciativa</span>'
    : ini.type === 'small-project'
      ? '<span class="badge badge-small-project"><span class="badge-dot"></span>Small Project</span>'
      : '<span class="badge badge-sin-clasificar"><span class="badge-dot"></span>Sin clasificar</span>';

  const statusBadge = isCompleted
    ? '<span class="status status-completed"><span class="status-dot"></span>Completada</span>'
    : isBlocked
      ? '<span class="status status-blocked"><span class="status-dot"></span>Bloqueada</span>'
      : ini.status === 'pending'
        ? '<span class="status status-pending"><span class="status-dot"></span>En espera</span>'
        : '<span class="status status-active"><span class="status-dot"></span>En curso</span>';

  return `
    <div class="progress-card" onclick="openDetail('${ini.folio}')">

/* ═══════════════════════════════════════════════════════════════════
   WIZARD · NUEVA INICIATIVA

function renderWizard() {
  const w = state.wizard;
  const stepsConfig = [
    { num: 1, label: 'Paso 1', title: 'Identificación' },
    { num: 2, label: 'Paso 2', title: 'Contenido' },
    { num: 3, label: 'Paso 3', title: 'Confirmación' },
  ];

  const content = `
    <div class="wizard-shell">
      <!-- Progress bar -->
      <div class="wizard-progress">
        ${stepsConfig.map((s, idx) => {
          const isActive = s.num === w.step;
          const isCompleted = s.num < w.step;
          const cls = isActive ? 'active' : isCompleted ? 'completed' : '';
          return `
            <div class="wizard-step ${cls}">
              <div class="wizard-step-circle">${isCompleted ? '<i data-lucide="check"></i>' : s.num}</div>
              <div class="wizard-step-info">
                <div class="wizard-step-label">${s.label}</div>
                <div class="wizard-step-title">${s.title}</div>
              </div>
            </div>
            ${idx < stepsConfig.length - 1 ? `<div class="wizard-step-line ${s.num < w.step ? 'done' : ''}"></div>` : ''}
          `;
        }).join('')}
      </div>

      <!-- Card del paso actual -->
      ${w.step === 1 ? renderWizardStep1() : w.step === 2 ? renderWizardStep2() : renderWizardStep3()}

      <!-- Acciones -->
      <div class="wizard-actions">
        <button class="btn btn-ghost" onclick="cancelWizard()">
          <i data-lucide="x"></i> Cancelar
        </button>
        <div class="wizard-actions-right">
          ${w.step > 1 ? `
            <button class="btn btn-secondary" onclick="wizardPrev()">
              <i data-lucide="arrow-left"></i> Anterior
            </button>
          ` : ''}
          ${w.step < 3 ? `
            <button class="btn btn-secondary" onclick="saveDraftAndExit()">
              <i data-lucide="save"></i> Guardar borrador
            </button>
            <button class="btn btn-primary" onclick="wizardNext()">
              Continuar <i data-lucide="arrow-right"></i>
            </button>
          ` : `
            <button class="btn btn-primary" onclick="createInitiative()">
              <i data-lucide="rocket"></i> Crear iniciativa
            </button>
          `}
        </div>
      </div>
    </div>
  `;

  renderPageShell('nueva-iniciativa', 'Nueva iniciativa', 'plus-circle', content);
}

function updateWizardData(field, value) {
  state.wizard.data[field] = value;
}

function wizardNext() {
  const w = state.wizard;
  // Validación mínima por paso
  if (w.step === 1) {
    if (!w.data.nombre.trim() || !w.data.empresa.trim() || !w.data.solicitante.trim() || !w.data.area.trim()) {
      showToast('Completa los campos requeridos antes de continuar');
      return;
    }
  } else if (w.step === 2) {
    if (!w.data.objetivo.trim() || !w.data.alcance.trim()) {
      showToast('Objetivo y alcance son requeridos');
      return;
    }
  }
  if (w.step < 3) {
    w.step++;
    renderWizard();
    triggerAutosave();
  }
}

function wizardPrev() {
  if (state.wizard.step > 1) {
    state.wizard.step--;
    renderWizard();
  }
}

function saveDraftAndExit() {
  showToast('Borrador guardado · podrás retomarlo después');
  setTimeout(() => navTo('iniciativas'), 800);
}

function cancelWizard() {
  if (state.wizard.data.nombre || state.wizard.data.objetivo) {
    if (!confirm('¿Salir sin guardar? Perderás los datos capturados.')) return;
  }
  navTo('iniciativas');
}

function generateNextFolio() {
  // Encontrar el último número usado en INITIATIVES
  const maxNum = INITIATIVES.reduce((max, ini) => {
    const m = ini.folio.match(/\d{4}$/);
    return m ? Math.max(max, parseInt(m[0])) : max;
  }, 0);
  return `INI-2026-${String(maxNum + 1).padStart(4, '0')}`;
}

function createInitiative() {
  const d = state.wizard.data;
  const folio = generateNextFolio();

  // Construir el objeto iniciativa siguiendo el shape de INITIATIVES
  const nueva = {
    folio: folio,
    title: d.nombre,
    subtitle: d.objetivo.substring(0, 80) + (d.objetivo.length > 80 ? '…' : ''),
    type: 'sin-clasificar',  // siempre arranca sin clasificar
    stage: 1,
    stageName: 'Puerta Única',
    status: 'active',
    aiAgents: 1,  // Agente de Captura ya activo
    requester: d.solicitante,
    requesterInitials: d.solicitante.split(' ').map(p => p[0]).join('').substring(0, 2).toUpperCase(),
    requesterArea: d.area,
    days: 0,
    progress: 8,  // recién creada
    empresa: d.empresa,
    objetivo: d.objetivo,
    alcance: d.alcance,
    fields: {
      volumenUsuarios: {
        value: d.volumenUsuarios || null,
        status: d.volumenUsuarios ? 'resolved' : 'pending',
        aiSuggested: d.volumenUsuarios ? null : 'El agente puede sugerir un valor basado en proyectos similares'
      },
      presupuesto: {
        value: d.presupuesto || null,
        status: d.presupuesto ? 'resolved' : 'pending',
        aiSuggested: d.presupuesto ? null : 'El agente puede sugerir un rango basado en el plan financiero'
      },
      sistemasFuente: {
        value: d.sistemasFuente || null,
        status: d.sistemasFuente ? 'resolved' : 'pending',
        aiSuggested: null
      },
      compliance: {
        value: d.compliance || null,
        status: d.compliance ? 'resolved' : 'pending',
        aiSuggested: null
      }
    },
    ballpark: {
      total: 0, weeks: 0, confidence: 0,
      teams: [
        { name: 'Desarrollo', icon: 'code', hours: 0, sub: 'Pendiente · Etapa 5', pct: 0 },
        { name: 'Infraestructura', icon: 'server', hours: 0, sub: 'Pendiente · Etapa 5', pct: 0 },
        { name: 'Integraciones', icon: 'link', hours: 0, sub: 'Pendiente · Etapa 5', pct: 0 },
        { name: 'Testing', icon: 'shield-check', hours: 0, sub: 'Pendiente · Etapa 5', pct: 0 },
        { name: 'Nube', icon: 'cloud', hours: 0, sub: 'Pendiente · Etapa 5', pct: 0 },
        { name: 'Monitoreo', icon: 'activity', hours: 0, sub: 'Pendiente · Etapa 5', pct: 0 },
      ]
    }
  };

  INITIATIVES.unshift(nueva);
  showToast(`${folio} creada · iniciando Agente de Captura…`);
  setTimeout(() => openDetail(folio), 600);
}

/* ═══════════════════════════════════════════════════════════════════
   READ-ONLY MODE para iniciativas completadas
   ═══════════════════════════════════════════════════════════════════ */
function isInitiativeCompleted(ini) {
  return ini && (ini.status === 'completed' || ini.stage === 11);
}

function isStageReadOnly() {
  return isInitiativeCompleted(state.currentInitiative);
}

function renderReadOnlyBanner() {
  if (!isInitiativeCompleted(state.currentInitiative)) return '';
  const stage = STAGES.find(s => s.num === state.currentStage);
  return `
    <div class="readonly-banner">
      <div class="readonly-banner-icon"><i data-lucide="check-circle"></i></div>
      <div class="readonly-banner-body">
        <div class="readonly-banner-title">Iniciativa completada · Modo lectura</div>
        <div class="readonly-banner-desc">Esta iniciativa ya pasó por todas las etapas. Puedes navegar para revisar lo que se llenó en cada paso, pero no es posible editar.</div>
      </div>
    </div>
  `;
}

function renderPersistentExcelBar() {
  if (!isInitiativeCompleted(state.currentInitiative)) return '';
  return `
    <div class="persistent-excel-bar">
      <div class="persistent-excel-info">
        <i data-lucide="check-circle-2"></i>
        <span>Esta iniciativa está <strong>completada</strong>. El Excel consolidado está listo para revisión de alto nivel.</span>
      </div>
      <button class="btn btn-primary" onclick="releaseExcel()">
        <i data-lucide="download"></i> Descargar Excel
      </button>
    </div>
  `;
}
